# Example only: copy to .github/workflows/docs-preview.yml to enable. Not active from this location.
# Builds docs-site (Astro Starlight) from ../docs and deploys it to GitHub Pages.
# Pages must be set to "GitHub Actions" as the source in the repository settings.
name: Docs preview

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - docs-site/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Install
        working-directory: docs-site
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: docs-site
        env:
          DOCS_SITE: https://${{ github.repository_owner }}.github.io
          DOCS_BASE: /${{ github.event.repository.name }}
          DOCS_REPO: https://github.com/${{ github.repository }}
          DOCS_REF: ${{ github.ref_name }}
        run: bun run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
